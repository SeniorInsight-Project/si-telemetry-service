spring:
  application.name: si-telemetry-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight_telemetry}
    username: ${DB_USERNAME:seniorinsight}
    password: ${DB_PASSWORD:seniorinsight}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
seniorinsight:
  integrations.openwearables:
    enabled: ${OPENWEARABLES_ENABLED:false}
    base-url: ${OPENWEARABLES_BASE_URL:https://api.openwearables.io}
    api-key: ${OPENWEARABLES_API_KEY:}
