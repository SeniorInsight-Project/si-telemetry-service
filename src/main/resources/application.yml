spring:
  application.name: si-telemetry-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight_telemetry}
    username: ${DB_USERNAME:seniorinsight}
    password: ${DB_PASSWORD:seniorinsight}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
seniorinsight:
  care-service:
    base-url: ${CARE_SERVICE_BASE_URL:http://localhost:8080}
  integrations.openwearables:
    enabled: ${OPENWEARABLES_ENABLED:false}
    base-url: ${OPENWEARABLES_BASE_URL:https://api.openwearables.io}
    api-key: ${OPENWEARABLES_API_KEY:}
  sync-monitoring:
    interval-ms: ${SYNC_MONITORING_INTERVAL_MS:900000}
    threshold: ${SYNC_MONITORING_THRESHOLD:PT3H}
    day-start: ${SYNC_MONITORING_DAY_START:07:00}
    day-end: ${SYNC_MONITORING_DAY_END:22:00}
    time-zone: ${SYNC_MONITORING_TIME_ZONE:America/Sao_Paulo}
